<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fondo hucha Tigresas</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --pink: #ff3d8a;
    --pink-text: #ff7faf;
    --pig: #ffa8c6;
    --pig-dark: #ff6fa5;
    --pig-snout: #ffd3e3;
    --pig-blush: #ff85b3;
    --pig-eye: #3a2436;
    --pig-slot: #c4477e;
    --stripe: #b0206f;
    --bg: #0b1711;
    --verde: #22a45d;
    --verde-vivo: #3ddc84;
    --text: #f7f2f6;
    --muted: #9db8a8;
    --display: 'Outfit', system-ui, sans-serif;
    --body: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  @page { size: 18cm 13cm; margin: 0; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .lienzo {
    position: relative; overflow: hidden;
    width: 18cm; height: 13cm;
    background:
      radial-gradient(circle at 27% 52%, rgba(34, 164, 93, .50) 0%, rgba(21, 122, 66, .20) 30%, transparent 56%),
      radial-gradient(circle at 100% 0%, rgba(21, 122, 66, .35) 0%, transparent 42%),
      var(--bg);
    color: var(--text);
    font-family: var(--body);
  }
  .rayas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cerdita { position: absolute; left: 0.5cm; top: 1.75cm; width: 9.2cm; height: 9.2cm;
             filter: drop-shadow(0 .25cm .45cm rgba(0,0,0,.45)); }
  .texto { position: absolute; left: 9.7cm; right: 0.9cm; top: 1.6cm; }
  .ante { display: flex; align-items: center; gap: .3cm; font-weight: 800; font-size: 11pt; letter-spacing: .12em; white-space: nowrap; color: #fff; }
  .escudo { width: 1.5cm; height: 1.5cm; border-radius: 50%; overflow: hidden; flex: none;
            background: #fff; box-shadow: 0 0 0 .08cm rgba(255,255,255,.9), 0 .12cm .3cm rgba(0,0,0,.4); }
  .escudo img { width: 100%; height: 100%; display: block; transform: scale(1.02); }
  .ante small { display: block; font-size: 9pt; letter-spacing: .32em; color: var(--muted); margin-top: .12cm; }
  h1 { font-family: var(--display); font-weight: 900; font-size: 41pt; line-height: .9;
       letter-spacing: -.02em; margin: .35cm 0 0; text-transform: uppercase; }
  h1 span { color: var(--verde-vivo); }
  .hucha { font-family: var(--display); font-weight: 700; font-size: 21pt; margin-top: .3cm;
           color: var(--pig); letter-spacing: -.01em; }
  .regla { display: flex; align-items: center; gap: .3cm; margin-top: .75cm;
           padding: .28cm .42cm; border-radius: 999px; width: max-content;
           background: linear-gradient(135deg, #22a45d 0%, #137a40 100%);
           box-shadow: 0 .2cm .5cm rgba(19, 122, 64, .45); }
  .regla svg { width: .75cm; height: .75cm; flex: none; }
  .regla b { font-family: var(--display); font-weight: 800; font-size: 17pt; font-variant-numeric: tabular-nums; }
  .regla .igual { margin: 0 .22cm 0 .08cm; }
  .regla em { font-style: normal; font-weight: 700; font-size: 11pt; }
  .pie { position: absolute; left: 9.7cm; bottom: 1.05cm; font-size: 8.5pt; font-weight: 700;
         letter-spacing: .28em; color: var(--muted); display: flex; align-items: center; gap: .25cm; }
  .pie i { width: .9cm; height: 2px; background: var(--verde-vivo); border-radius: 2px; display: block; }
</style>
</head>
<body>
<div class="lienzo">

  <!-- Rayas de tigresa de fondo (tapered, desde los bordes hacia dentro) -->
  <svg class="rayas" viewBox="0 0 180 130" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#3ddc84" opacity=".08">
      <!-- borde superior -->
      <path d="M96 0 C 98 7, 103 12, 111 15 C 105 10, 103 5, 104 0 Z"/>
      <path d="M118 0 C 118 9, 123 17, 133 21 C 127 14, 125 7, 127 0 Z"/>
      <path d="M141 0 C 141 7, 146 12, 153 14 C 148 9, 147 4, 149 0 Z"/>
      <path d="M160 0 C 161 10, 167 18, 180 22 L 180 14 C 172 11, 168 6, 168 0 Z"/>
      <!-- borde derecho -->
      <path d="M180 36 C 172 37, 164 41, 160 48 C 166 44, 173 43, 180 44 Z"/>
      <path d="M180 60 C 170 60, 161 64, 156 72 C 163 67, 171 66, 180 68 Z"/>
      <path d="M180 86 C 173 87, 167 90, 163 96 C 168 93, 174 92, 180 93 Z"/>
      <!-- borde inferior -->
      <path d="M170 130 C 168 122, 162 116, 154 113 C 159 118, 161 124, 160 130 Z"/>
      <path d="M146 130 C 145 121, 139 114, 130 111 C 135 117, 137 124, 136 130 Z"/>
      <path d="M68 130 C 70 122, 76 117, 84 115 C 79 120, 77 125, 78 130 Z"/>
      <path d="M40 130 C 40 121, 45 114, 54 110 C 49 117, 48 124, 49 130 Z"/>
      <path d="M14 130 C 16 123, 21 118, 28 116 C 24 121, 22 126, 23 130 Z"/>
      <!-- borde izquierdo -->
      <path d="M0 16 C 8 17, 15 21, 19 28 C 13 24, 6 23, 0 24 Z"/>
      <path d="M0 96 C 7 95, 13 97, 18 102 C 12 100, 6 100, 0 102 Z"/>
      <!-- borde superior izquierdo -->
      <path d="M22 0 C 23 6, 27 10, 33 12 C 29 8, 28 4, 29 0 Z"/>
      <path d="M52 0 C 52 7, 56 12, 63 14 C 58 9, 58 4, 60 0 Z"/>
    </g>
  </svg>

  <!-- Cerdita tigresa: la cerdita de la app (mismas formas, guiño incluido) con rayas de tigre -->
  <svg class="cerdita" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <clipPath id="cuerpo"><ellipse cx="32" cy="36" rx="24" ry="20.5"/></clipPath>
      <clipPath id="orejaI"><path d="M15.5 21 12.6 8.2c-.4-1.8 1-2.6 2.4-1.7L27 13.8Z"/></clipPath>
      <clipPath id="orejaD"><path d="M48.5 21l2.9-12.8c.4-1.8-1-2.6-2.4-1.7L37 13.8Z"/></clipPath>
    </defs>
    <path d="M52 33c6-2 7.5 4.5 2.2 6-2.8.8-3.8-2.2-1.2-3" fill="none" stroke="var(--pig-dark)" stroke-width="3" stroke-linecap="round"/>
    <path d="M15.5 21 12.6 8.2c-.4-1.8 1-2.6 2.4-1.7L27 13.8Z" fill="var(--pig-dark)"/>
    <path d="M48.5 21l2.9-12.8c.4-1.8-1-2.6-2.4-1.7L37 13.8Z" fill="var(--pig-dark)"/>
    <!-- rayas en las orejas -->
    <g fill="var(--stripe)" clip-path="url(#orejaI)">
      <path d="M11 11 C 15 11.5, 18 12.5, 20 14.5 C 17 13.6, 14 13.3, 11 13.6 Z"/>
    </g>
    <g fill="var(--stripe)" clip-path="url(#orejaD)">
      <path d="M53 11 C 49 11.5, 46 12.5, 44 14.5 C 47 13.6, 50 13.3, 53 13.6 Z"/>
    </g>
    <ellipse cx="32" cy="36" rx="24" ry="20.5" fill="var(--pig)"/>
    <!-- rayas de tigre del cuerpo -->
    <g fill="var(--pig-dark)" clip-path="url(#cuerpo)">
      <!-- frente -->
      <path d="M32 22.6 C 30.7 24.6, 30.9 27, 32 29 C 33.1 27, 33.3 24.6, 32 22.6 Z"/>
      <path d="M26.2 23.2 C 26 25.2, 26.8 27, 28.4 28 C 28.2 26.3, 27.6 24.6, 26.2 23.2 Z"/>
      <path d="M37.8 23.2 C 38 25.2, 37.2 27, 35.6 28 C 35.8 26.3, 36.4 24.6, 37.8 23.2 Z"/>
      <!-- costado izquierdo -->
      <path d="M7 24.5 C 11 25, 15 26.4, 17.5 29 C 14 28, 10.5 27.8, 7 28.4 Z"/>
      <path d="M7 32.5 C 10.5 32.6, 13.4 33.6, 15.2 35.6 C 12.5 35, 9.8 35, 7 35.6 Z"/>
      <!-- costado derecho -->
      <path d="M57 24.5 C 53 25, 49 26.4, 46.5 29 C 50 28, 53.5 27.8, 57 28.4 Z"/>
      <path d="M57 32.5 C 53.5 32.6, 50.6 33.6, 48.8 35.6 C 51.5 35, 54.2 35, 57 35.6 Z"/>
    </g>
    <ellipse cx="17" cy="41" rx="4" ry="2.6" fill="var(--pig-blush)"/>
    <ellipse cx="47" cy="41" rx="4" ry="2.6" fill="var(--pig-blush)"/>
    <rect x="25" y="18" width="14" height="3.6" rx="1.8" fill="var(--pig-slot)"/>
    <circle cx="22.5" cy="33" r="2.7" fill="var(--pig-eye)"/>
    <path d="M38.5 33.4c1.6-2.2 3.8-2.2 5.4 0" fill="none" stroke="var(--pig-eye)" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="32" cy="45" rx="11.5" ry="8.5" fill="var(--pig-snout)"/>
    <ellipse cx="28.2" cy="45" rx="2" ry="2.6" fill="var(--pig-dark)"/>
    <ellipse cx="35.8" cy="45" rx="2" ry="2.6" fill="var(--pig-dark)"/>
  </svg>

  <div class="texto">
    <div class="ante"><span class="escudo"><img src="escudo.jpg" alt=""></span>CVLF LES FRANQUESES</div>
    <h1>Tigre<span>sas</span></h1>
    <div class="hucha">Hucha de saques</div>
    <div class="regla">
      <!-- pelota: mismo icono de trazo que la app -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M5.6 5.6c3.5 2.9 4.5 9 2.5 13.1"/>
        <path d="M18.4 5.6c-3.5 2.9-4.5 9-2.5 13.1"/>
      </svg>
      <em>Saque fallado</em><b><span class="igual">=</span>1&nbsp;€</b>
    </div>
  </div>

  <div class="pie"><i></i>TEMPORADA 2026 / 27</div>
</div>
</body>
</html>
