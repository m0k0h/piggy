name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Diagnóstico temporal de secretos (no imprime valores)
        run: |
          check() {
            if [ -z "$2" ]; then echo "$1: VACÍO"; else echo "$1: presente (${#2} caracteres)"; fi
          }
          check "VITE_SUPABASE_URL" "$VITE_SUPABASE_URL"
          check "VITE_SUPABASE_ANON_KEY" "$VITE_SUPABASE_ANON_KEY"
          check "VITE_TEAM_CODE" "$VITE_TEAM_CODE"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TEAM_CODE: ${{ secrets.VITE_TEAM_CODE }}
      - run: npm run build
        # La conexión con Supabase se compila dentro de la app. La clave `anon`
        # es pública por diseño; lo que protege los datos son las políticas de
        # supabase/schema.sql.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TEAM_CODE: ${{ secrets.VITE_TEAM_CODE }}
