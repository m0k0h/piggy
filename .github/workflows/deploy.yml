name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar (sin revelarlas) si las claves de Supabase están puestas
        run: |
          echo "VITE_SUPABASE_URL configurada: ${{ secrets.VITE_SUPABASE_URL != '' }}"
          echo "VITE_SUPABASE_ANON_KEY configurada: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}"
          echo "VITE_TEAM_CODE configurada: ${{ secrets.VITE_TEAM_CODE != '' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # La conexión con Supabase se compila dentro de la app. La clave `anon`
        # es pública por diseño; lo que protege los datos son las políticas de
        # supabase/schema.sql.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TEAM_CODE: ${{ secrets.VITE_TEAM_CODE }}
      - uses: actions/configure-pages@v5
        # Activa Pages en el repositorio la primera vez, sin tener que
        # entrar a Settings → Pages a mano.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
