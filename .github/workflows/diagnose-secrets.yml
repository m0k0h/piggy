name: Diagnóstico temporal de secretos

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si los secretos llegan al job
        run: |
          check() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name: VACÍO"
            else
              echo "$name: presente (${#value} caracteres)"
            fi
          }
          check "VITE_SUPABASE_URL" "$VITE_SUPABASE_URL"
          check "VITE_SUPABASE_ANON_KEY" "$VITE_SUPABASE_ANON_KEY"
          check "VITE_TEAM_CODE" "$VITE_TEAM_CODE"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TEAM_CODE: ${{ secrets.VITE_TEAM_CODE }}
